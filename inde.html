<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skyexpress Travel</title>

<style>

body{
margin:0;
font-family:Arial;
background:black;
overflow:hidden;
}

.scene{
position:absolute;
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
font-size:40px;
text-align:center;
opacity:0;
animation-duration:5s;
animation-fill-mode:forwards;
}

.scene1{
background:url("city.jpg") center/cover;
animation:show1 5s;
}

.scene2{
background:url("phone.jpg") center/cover;
animation:show2 5s;
animation-delay:5s;
}

.scene3{
background:url("agency.jpg") center/cover;
animation:show3 5s;
animation-delay:10s;
}

.scene4{
background:url("airport.jpg") center/cover;
animation:show4 5s;
animation-delay:15s;
}

.scene5{
background:url("destination.jpg") center/cover;
animation:show5 5s;
animation-delay:20s;
}

@keyframes show1{
0%{opacity:0}
10%{opacity:1}
90%{opacity:1}
100%{opacity:0}
}

@keyframes show2{
0%{opacity:0}
10%{opacity:1}
90%{opacity:1}
100%{opacity:0}
}

@keyframes show3{
0%{opacity:0}
10%{opacity:1}
90%{opacity:1}
100%{opacity:0}
}

@keyframes show4{
0%{opacity:0}
10%{opacity:1}
90%{opacity:1}
100%{opacity:0}
}

@keyframes show5{
0%{opacity:0}
10%{opacity:1}
100%{opacity:1}
}

</style>
</head>

<body>

<div class="scene scene1">
Dëshironi një pushimë ?
</div>

<div class="scene scene2">
Qmimet jane te shtrenjta ...?
</div>

<div class="scene scene3">
 Ejani ne Skyexpress✈️
</div>

<div class="scene scene4">
Udhëtimet bëhen më të lehta...
</div>

<div class="scene scene5">
Bota është më afër se që mendoni...🌍
</div>

<div class="scene scene6">
    Rezervoni qe tani...
</div>

<div class="scene scene7">
    Nr. kontaktues: +383 45 264 580
</div>

</body>
</html>
